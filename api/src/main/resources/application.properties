spring.application.name=stockhold-api

# Database: values come from environment variables, never from git
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockhold}
spring.datasource.username=${DB_USER:stockhold}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate never changes it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Health and info only for now
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true